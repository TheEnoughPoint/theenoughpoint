<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Which gold? Five ways to own gold in Singapore: the metal itself, a bank claim, a US-trust ETF, a Singapore-trust ETF, and mining equities. Same metal, five different assets.">
  <!-- Cover for the gold-routes piece ("You Want Gold. Which Gold?").
       House system: navy field, gold serif figure, small-caps kicker, italic
       payoff, wordmark at foot.

       This cover deliberately leads with the QUESTION rather than a money
       figure: the piece is a taxonomy, not a single-number story, and every
       candidate number (route costs) is an illustrative default that has no
       business on a cover. The five panels are drawn identical on purpose —
       equal footing is the piece's stance, so the picture must not rank them.

       Safe zone: the question and kicker sit inside x 300-900; the five panels
       run x 184-1016, so a square crop trims the outer two — that crop is only
       the 80px mobile thumbnail, where panel labels are illegible anyway. The
       wordmark is centred and survives every crop. -->
  <defs>
    <radialGradient id="bgGR" cx="50%" cy="40%" r="76%">
      <stop offset="0%" stop-color="#10233D"/>
      <stop offset="100%" stop-color="#081627"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGR)"/>

  <text x="600" y="96" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        letter-spacing="3.5" fill="#F6F4EF" opacity="0.55">FIVE WAYS TO OWN GOLD IN SINGAPORE</text>

  <text x="600" y="238" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="110"
        fill="#C89A3C">Which gold?</text>

  <!-- five routes, drawn equal on purpose -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="184" y="300" width="152" height="96" rx="8" fill="#F6F4EF" fill-opacity="0.055" stroke="#C89A3C" stroke-opacity="0.55"/>
    <line x1="204" y1="316" x2="316" y2="316" stroke="#C89A3C" stroke-width="2" opacity="0.75"/>
    <text x="260" y="346" font-size="14" fill="#F6F4EF" opacity="0.9">THE METAL</text>
    <text x="260" y="368" font-size="10.5" font-weight="600" fill="#F6F4EF" opacity="0.5">VAULTED BARS &#183; NO GST</text>

    <rect x="354" y="300" width="152" height="96" rx="8" fill="#F6F4EF" fill-opacity="0.055" stroke="#C89A3C" stroke-opacity="0.55"/>
    <line x1="374" y1="316" x2="486" y2="316" stroke="#C89A3C" stroke-width="2" opacity="0.75"/>
    <text x="430" y="346" font-size="14" fill="#F6F4EF" opacity="0.9">A BANK CLAIM</text>
    <text x="430" y="368" font-size="10.5" font-weight="600" fill="#F6F4EF" opacity="0.5">GRAMS ON ACCOUNT</text>

    <rect x="524" y="300" width="152" height="96" rx="8" fill="#F6F4EF" fill-opacity="0.055" stroke="#C89A3C" stroke-opacity="0.55"/>
    <line x1="544" y1="316" x2="656" y2="316" stroke="#C89A3C" stroke-width="2" opacity="0.75"/>
    <text x="600" y="346" font-size="14" fill="#F6F4EF" opacity="0.9">A US TRUST</text>
    <text x="600" y="368" font-size="10.5" font-weight="600" fill="#F6F4EF" opacity="0.5">ETF &#183; BARS IN LONDON</text>

    <rect x="694" y="300" width="152" height="96" rx="8" fill="#F6F4EF" fill-opacity="0.055" stroke="#C89A3C" stroke-opacity="0.55"/>
    <line x1="714" y1="316" x2="826" y2="316" stroke="#C89A3C" stroke-width="2" opacity="0.75"/>
    <text x="770" y="346" font-size="14" fill="#F6F4EF" opacity="0.9">AN SG TRUST</text>
    <text x="770" y="368" font-size="10.5" font-weight="600" fill="#F6F4EF" opacity="0.5">ETF &#183; BARS IN SINGAPORE</text>

    <rect x="864" y="300" width="152" height="96" rx="8" fill="#F6F4EF" fill-opacity="0.055" stroke="#C89A3C" stroke-opacity="0.55"/>
    <line x1="884" y1="316" x2="996" y2="316" stroke="#C89A3C" stroke-width="2" opacity="0.75"/>
    <text x="930" y="346" font-size="14" fill="#F6F4EF" opacity="0.9">THE MINERS</text>
    <text x="930" y="368" font-size="10.5" font-weight="600" fill="#F6F4EF" opacity="0.5">EQUITIES, NOT METAL</text>
  </g>

  <text x="600" y="470" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"
        letter-spacing="0.4" fill="#F6F4EF" opacity="0.65">different costs &#183; different counterparties &#183; different law on the day it changes hands</text>

  <text x="600" y="528" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25"
        fill="#F6F4EF" opacity="0.8">Same metal. Five different assets.</text>

  <text x="600" y="572" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        letter-spacing="2.6" fill="#C89A3C" opacity="0.72">THEENOUGHPOINT.COM</text>
</svg>
