<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Progressive payment saves about S$44,000 of interest and costs about S$176,000 of rent, roughly four times the saving">
  <!-- Cover for the progressive-payment piece. House system: navy field, gold figure.
       The finding is a ratio between two real numbers pulling opposite ways, so the
       figure is the pair, with the saving stated first because the claim is half true.
       Stacked, following cover-unsold-districts and cover-price-a-new-launch.
       Safe zone: square thumbnail crops to x 300-900. -->
  <defs>
    <radialGradient id="bgPP" cx="50%" cy="42%" r="76%">
      <stop offset="0%" stop-color="#10233D"/>
      <stop offset="100%" stop-color="#081627"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgPP)"/>

  <text x="600" y="120" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        letter-spacing="3.5" fill="#F6F4EF" opacity="0.55">PAYING AS IT IS BUILT</text>

  <text x="600" y="212" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="38"
        fill="#F6F4EF" opacity="0.62">saves about S$44,000 of interest</text>

  <text x="600" y="352" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="106"
        fill="#C89A3C">costs S$176,000</text>

  <text x="600" y="402" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600"
        letter-spacing="0.4" fill="#F6F4EF" opacity="0.9">of rent, while you wait for the keys</text>

  <line x1="450" y1="452" x2="750" y2="452" stroke="#C89A3C" stroke-width="1.5" opacity="0.5"/>

  <text x="600" y="502" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="27"
        fill="#F6F4EF" opacity="0.86">Unless you have somewhere</text>
  <text x="600" y="542" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="27"
        fill="#F6F4EF" opacity="0.86">free to live. Then it flips.</text>
</svg>
