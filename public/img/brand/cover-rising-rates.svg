<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Two lines rising together across the 1960s: the 10-year Treasury yield climbing gently, and the share market climbing steeply above it. Rates rose 2.2 points; shares doubled.">
  <!-- Cover for the rising-rates piece.
       House system: navy field, gold serif figure, small-caps kicker, italic
       payoff, wordmark at foot. Interim typographic cover — swap for owner
       comic art when available, per the site's cover pivot of 6 Aug 2026.

       Draws the mechanism rather than naming it: the whole argument is that
       yields and shares ROSE TOGETHER through the sixties, so the picture is
       simply both lines climbing on one panel. Gold = shares (identity),
       thin ivory = the yield. No verdict colours.

       Safe zone: kicker, headline and payoff sit inside x 300-900. The chart
       runs x 150-1050 so a square crop trims the outer thirds without touching
       either line's label. -->

  <rect width="1200" height="600" fill="#081627"/>
  <rect x="0" y="0" width="1200" height="600" fill="#0E2038" opacity="0.55"/>

  <!-- kicker -->
  <text x="600" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" letter-spacing="3.4" fill="#C89A3C" font-weight="700">THE FEAR EVERY BULL MARKET MEETS</text>

  <!-- headline -->
  <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" fill="#F6F4EF">Rates are rising again.</text>

  <text x="600" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#F6F4EF" opacity="0.72">1963&#8211;1968: the 10-year yield climbed 2.2 points &#8212; and shares doubled</text>

  <!-- chart panel -->
  <rect x="150" y="262" width="900" height="212" rx="10" fill="#10233D"/>

  <!-- the yield: a gentle, persistent climb -->
  <polyline points="178,436 258,432 338,424 418,420 498,410 578,404 658,394 738,390 796,380 880,372 950,362 1022,354"
            fill="none" stroke="#F6F4EF" stroke-width="2" opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1004" y="342" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13"
        letter-spacing="1.4" fill="#F6F4EF" opacity="0.62">THE 10-YEAR YIELD, 3.9% &#8594; 6.0%</text>

  <!-- the market: climbs harder, dips on the way, ends far above -->
  <polyline points="178,440 240,420 300,428 360,400 420,378 480,388 540,352 600,330 660,342 720,308 780,318 840,286 900,296 960,300 1022,288"
            fill="none" stroke="#C89A3C" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1022" cy="288" r="8" fill="#0E2038" stroke="#C89A3C" stroke-width="4"/>
  <text x="965" y="278" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13"
        letter-spacing="1.4" fill="#C89A3C" font-weight="700">SHARES, DIVIDENDS IN: +105%</text>

  <!-- start marker -->
  <circle cx="178" cy="440" r="7" fill="#F6F4EF" opacity="0.8"/>
  <text x="188" y="462" font-family="Arial, Helvetica, sans-serif"
        font-size="12" letter-spacing="1.3" fill="#F6F4EF" opacity="0.6">DECEMBER 1962</text>

  <!-- payoff -->
  <text x="600" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="27" font-style="italic" fill="#F6F4EF">It was never the rates. It was the inflation behind them.</text>

  <!-- wordmark -->
  <text x="600" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" letter-spacing="4.2" fill="#C89A3C" opacity="0.85">THEENOUGHPOINT.COM</text>
</svg>
