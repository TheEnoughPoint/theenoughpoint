<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="The entire measured advantage is about three thousand eight hundred dollars, on a home where stamp duty alone is forty four thousand six hundred">
  <!-- Cover for the new-launch-versus-resale piece.

       IVORY VARIANT of the house system. Navy is the default field, but a list
       of articles rendered three navy blocks down a cream page — heavy, and it
       reads as one image repeated. Alternating the field gives the list rhythm
       and sits natively on the site's own ivory background. Same type, same
       gold, same wordmark; inverted ground. Rule of thumb: navy for the risk
       pieces, ivory for the comparison and planning ones.

       The field is the site's own cream (#F6F4EF to #E4DCCB), not a near-white.
       A near-white version dissolved at the edges against the white article
       list; brand cream reads as a block.

       The figure was "0.04pp" in the first draft. Percentage points are jargon, and a
       cover is the one place a reader cannot be asked to learn a unit — so the same
       finding is shown in money. S$3,817 is our annualised 2011-2021 gap compounded
       over six years on S$1.5m; rounded down on the cover, exact in the article.
       Stacked, following cover-leverage-decay. The two bars are the finding's
       own proportion: S$3,800 of advantage against S$44,600 of stamp duty on the
       same purchase, drawn to scale on a 500px track so the picture and the
       numbers cannot disagree.
       The list slot is 3:2 against this 2:1 artwork with object-fit:cover, so
       x below 150 and above 1050 are cropped there. Everything carrying meaning
       sits inside that band. -->
  <defs>
    <radialGradient id="bgNLR" cx="50%" cy="42%" r="76%">
      <stop offset="0%" stop-color="#F6F4EF"/>
      <stop offset="100%" stop-color="#E4DCCB"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgNLR)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#0B1D33"/>

  <text x="600" y="126" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        letter-spacing="3.5" fill="#0B1D33" opacity="0.5">NEW LAUNCH VERSUS RESALE</text>

  <text x="600" y="278" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="128"
        fill="#9C7526">S$3,800</text>

  <text x="600" y="336" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600"
        letter-spacing="0.4" fill="#0B1D33" opacity="0.78">the entire measured advantage</text>

  <line x1="450" y1="386" x2="750" y2="386" stroke="#9C7526" stroke-width="1.5" opacity="0.55"/>

  <text x="600" y="428" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="26"
        fill="#33414F">on a S$1.5m home held six years</text>

  <!-- to scale: 3,800 against 44,600 on a 500px track -->
  <text x="336" y="486" text-anchor="end"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"
        fill="#0B1D33" opacity="0.6">the advantage</text>
  <rect x="350" y="472" width="43" height="18" rx="3" fill="#9C7526"/>
  <text x="405" y="486"
        font-family="Georgia, 'Times New Roman', serif" font-size="19"
        fill="#9C7526">S$3,800</text>

  <text x="336" y="522" text-anchor="end"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"
        fill="#0B1D33" opacity="0.6">the stamp duty</text>
  <rect x="350" y="508" width="500" height="18" rx="3" fill="#0B1D33" opacity="0.3"/>
  <text x="862" y="522"
        font-family="Georgia, 'Times New Roman', serif" font-size="19"
        fill="#33414F">S$44,600</text>

  <text x="600" y="572" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        letter-spacing="2.6" fill="#9C7526" opacity="0.85">THEENOUGHPOINT.COM</text>
</svg>
