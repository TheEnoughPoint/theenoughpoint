<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="What are your KrisFlyer miles worth? The same one hundred thousand miles are worth about one thousand Singapore dollars if you spend them in the shop, at roughly one cent each, or about five thousand dollars if you spend them on a business-class seat. Same balance, and the difference is your decision.">
  <!-- Cover for the miles piece ("What Are KrisFlyer Miles Worth? One Cent, or Five").
       House system: navy field, gold serif figure, small-caps kicker, italic
       payoff, wordmark at foot. Companion to cover-which-card.svg.

       REDRAWN 13 Aug 2026, alongside the article's plain-English rewrite. The
       previous version led with "One cent, at best" over three panels carrying
       award-chart multiples (2.07-2.48x and so on). Those multiples are facts,
       but they are facts in the vocabulary of somebody who already knows what an
       award chart is — the same failure the card cover had.

       This version states the answer in the unit the reader actually holds:
       dollars, on a round balance. 100,000 miles is a plausible balance for
       somebody who has been collecting a while, S$1,000 is the cash-out value at
       the published 1-cent rate, and S$5,000 is the upper end of the 3-5c band
       reported for well-used Saver and Advantage redemptions. The article sources
       both ends.

       Safe zone: kicker, figure and payoff sit inside x 300-900; the two panels
       run x 240-960, so a square crop trims only their outer edges. -->
  <defs>
    <radialGradient id="bgMV" cx="50%" cy="40%" r="76%">
      <stop offset="0%" stop-color="#10233D"/>
      <stop offset="100%" stop-color="#081627"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgMV)"/>

  <text x="600" y="90" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        letter-spacing="3.5" fill="#F6F4EF" opacity="0.55">WHAT ARE YOUR KRISFLYER MILES WORTH?</text>

  <text x="600" y="206" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="92"
        fill="#C89A3C">S$1,000 or S$5,000</text>

  <text x="600" y="250" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600"
        letter-spacing="0.4" fill="#F6F4EF" opacity="0.62">the same 100,000 miles &#8212; and nothing about them changes between those two numbers</text>

  <!-- the two ends of the range -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="240" y="306" width="330" height="118" rx="8" fill="#F6F4EF" fill-opacity="0.05" stroke="#F6F4EF" stroke-opacity="0.22"/>
    <text x="405" y="342" font-size="13" font-weight="700" letter-spacing="1.4" fill="#F6F4EF" opacity="0.5">SPENT IN THE SHOP</text>
    <text x="405" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#F6F4EF" opacity="0.72">about 1&#162; each</text>
    <text x="405" y="408" font-size="12" font-weight="600" fill="#F6F4EF" opacity="0.42">no planning, no seat to find</text>

    <rect x="630" y="306" width="330" height="118" rx="8" fill="#C89A3C" fill-opacity="0.12" stroke="#C89A3C" stroke-opacity="0.7"/>
    <text x="795" y="342" font-size="13" font-weight="700" letter-spacing="1.4" fill="#C89A3C">SPENT ON A BUSINESS SEAT</text>
    <text x="795" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#C89A3C">several times that</text>
    <text x="795" y="408" font-size="12" font-weight="600" fill="#F6F4EF" opacity="0.5">booked early, on the cheapest tier</text>
  </g>

  <text x="600" y="462" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600"
        letter-spacing="0.4" fill="#F6F4EF" opacity="0.55">the airline charges a big premium in cash for the front cabin, and only a small one in miles</text>

  <text x="600" y="524" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27"
        fill="#F6F4EF" opacity="0.85">Same balance. Your decision.</text>

  <text x="600" y="572" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        letter-spacing="2.6" fill="#C89A3C" opacity="0.72">THEENOUGHPOINT.COM</text>
</svg>
