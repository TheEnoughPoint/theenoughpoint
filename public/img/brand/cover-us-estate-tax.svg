<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="US estate tax on US-situated shares: the exemption stops at US$60,000">
  <!-- Cover for the US estate-tax article. Brand palette: navy #0B1D33 field,
       gold #C89A3C figure, forest/red split bar echoing the calculator's
       keep/tax bar (79/21 at the article's S$250,000 default case).
       Safe zone: sidebar thumbnails crop this 2:1 canvas to a square, so all
       content stays within x 300-900; 3:2 cards crop to x 150-1050. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#10233D"/>
      <stop offset="100%" stop-color="#081627"/>
    </radialGradient>
    <clipPath id="bar">
      <rect x="310" y="462" width="580" height="13" rx="6.5"/>
    </clipPath>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- eyebrow label -->
  <text x="600" y="158" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700"
        letter-spacing="3.5" fill="#F6F4EF" opacity="0.62">US ESTATE TAX &#183; US-SITUATED SHARES</text>

  <!-- the figure -->
  <text x="600" y="330" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="112"
        letter-spacing="-2" fill="#C89A3C">US$60,000</text>

  <!-- sub-line -->
  <text x="600" y="390" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27"
        fill="#F6F4EF" opacity="0.78">where the exemption stops</text>

  <!-- keep/tax split bar, 79/21 like the default case -->
  <g clip-path="url(#bar)">
    <rect x="310" y="462" width="580" height="13" fill="#4B9A78"/>
    <rect x="768" y="462" width="122" height="13" fill="#C0392B"/>
  </g>
  <text x="310" y="505" text-anchor="start"
        font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="0.5"
        fill="#7DB79A">reaches your family</text>
  <text x="890" y="505" text-anchor="end"
        font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="0.5"
        fill="#E08074">US estate tax</text>

  <text x="600" y="572" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        letter-spacing="2.6" fill="#C89A3C" opacity="0.72">THEENOUGHPOINT.COM</text>
</svg>
