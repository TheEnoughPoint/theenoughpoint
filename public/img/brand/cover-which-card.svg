<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Which credit card should you carry? A card advertised at 4 miles per dollar blends to 1.30 miles per dollar at four thousand dollars of monthly spending, because the bonus rate stops at a one thousand dollar cap and everything above it earns 0.4. Two ceilings decide the outcome: the caps on your cards, and the share of your spending that lands in a bonus category. The card is half the answer, and the smaller half.">
  <!-- Cover for the card-selection piece ("Which Credit Card to Carry?").
       House system: navy field, gold serif figure, small-caps kicker, italic
       payoff, wordmark at foot. Companion to cover-mile-worth.svg — same
       geometry, so the two read as a pair in the archive.

       The figure is the article's whole argument in one line: the advertised
       rate and the earned rate are different numbers, and the gap is arithmetic
       rather than fine print. 4.00 and 1.30 are computed from published market
       structure (4 mpd bonus, S$1,000 monthly cap, 0.4 mpd base) at S$4,000 of
       monthly spend, not from any one card's terms — no issuer is named here or
       in the article, because card terms in this market change monthly.

       The two panels are the piece's correction to itself: an earlier draft
       argued the answer was simply "more cards". It is not. Bonus capacity is
       category-shaped, so a second ceiling binds, and for most households it is
       the one plastic cannot lift.

       Safe zone: kicker, figure and payoff sit inside x 300-900. The two panels
       run x 300-900 as well, so every element survives a square crop. -->
  <defs>
    <radialGradient id="bgWC" cx="50%" cy="40%" r="76%">
      <stop offset="0%" stop-color="#10233D"/>
      <stop offset="100%" stop-color="#081627"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgWC)"/>

  <text x="600" y="92" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        letter-spacing="3.5" fill="#F6F4EF" opacity="0.55">WHICH CREDIT CARD SHOULD YOU CARRY?</text>

  <!-- The advertised rate against the earned rate -->
  <g text-anchor="middle">
    <text x="600" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#C89A3C">4 mpd pays 1.30</text>
  </g>

  <text x="600" y="252" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"
        letter-spacing="0.4" fill="#F6F4EF" opacity="0.62">a S$1,000 monthly cap, 0.4 mpd above it, S$4,000 a month &#8212; the card did not underperform, the denominator grew</text>

  <!-- The two ceilings -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="300" y="308" width="280" height="108" rx="8" fill="#F6F4EF" fill-opacity="0.055" stroke="#C89A3C" stroke-opacity="0.55"/>
    <line x1="332" y1="326" x2="548" y2="326" stroke="#C89A3C" stroke-width="2" opacity="0.7"/>
    <text x="440" y="360" font-size="14" fill="#F6F4EF" opacity="0.9">CEILING ONE &#183; YOUR CAPS</text>
    <text x="440" y="388" font-size="11.5" font-weight="600" fill="#F6F4EF" opacity="0.5">another card lifts this one</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="620" y="308" width="280" height="108" rx="8" fill="#F6F4EF" fill-opacity="0.055" stroke="#C89A3C" stroke-opacity="0.55"/>
    <line x1="652" y1="326" x2="868" y2="326" stroke="#C89A3C" stroke-width="2" opacity="0.7"/>
    <text x="760" y="360" font-size="14" fill="#F6F4EF" opacity="0.9">CEILING TWO &#183; YOUR SPENDING</text>
    <text x="760" y="388" font-size="11.5" font-weight="600" fill="#F6F4EF" opacity="0.5">nothing in a wallet lifts this one</text>
  </g>

  <text x="600" y="458" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600"
        letter-spacing="0.4" fill="#F6F4EF" opacity="0.55">for most households it is the second one that binds &#8212; and it is the one nobody sells a product for</text>

  <text x="600" y="522" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25"
        fill="#F6F4EF" opacity="0.8">The card is half the answer. The smaller half.</text>

  <text x="600" y="572" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        letter-spacing="2.6" fill="#C89A3C" opacity="0.72">THEENOUGHPOINT.COM</text>
</svg>
