<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="The bonus stops at one thousand dollars. A bar shows four thousand dollars of monthly spending: the first thousand earns 4 miles per dollar, the remaining three thousand earns 0.4 miles per dollar, and the average across the whole month is 1.3. A four-mile card, earning 1.3.">
  <!-- Cover for the card-selection piece.
       House system: navy field, gold serif figure, small-caps kicker, italic
       payoff, wordmark at foot. Companion to cover-mile-worth.svg.

       REDRAWN 13 Aug 2026. The first version read "4 mpd pays 1.30" over two
       boxes labelled CEILING ONE and CEILING TWO. That was the argument written
       in the vocabulary of someone who already understood it: "mpd" is insider
       shorthand, and a reader cannot know why 1.30 is bad before being told what
       the cap is. The reader said so, and was right.

       This version draws the mechanism instead of naming it. The bar IS the
       month's spending; the gold quarter is the part that earns the advertised
       rate. Anyone can read the picture without knowing a single term, which is
       the only test a cover has to pass.

       Safe zone: kicker, headline and payoff sit inside x 300-900. The bar runs
       x 200-1000, so a square crop trims its outer segments — the gold segment
       and the average line, which carry the point, survive. -->
  <defs>
    <radialGradient id="bgWC" cx="50%" cy="40%" r="76%">
      <stop offset="0%" stop-color="#10233D"/>
      <stop offset="100%" stop-color="#081627"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgWC)"/>

  <text x="600" y="88" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        letter-spacing="3.5" fill="#F6F4EF" opacity="0.55">THE PART THE ADVERTISEMENT LEAVES OUT</text>

  <text x="600" y="196" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="82"
        fill="#C89A3C">The bonus stops at S$1,000</text>

  <text x="600" y="240" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600"
        letter-spacing="0.4" fill="#F6F4EF" opacity="0.62">after that, the same card pays about a tenth as much &#8212; and never stops calling itself a 4-mile card</text>

  <!-- One month of spending, drawn to scale: S$4,000 across 800px -->
  <g>
    <text x="200" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12"
          font-weight="700" letter-spacing="1.6" fill="#F6F4EF" opacity="0.45">ONE MONTH &#183; S$4,000 ON THE CARD</text>

    <rect x="200" y="304" width="200" height="58" rx="4" fill="#C89A3C"/>
    <rect x="400" y="304" width="600" height="58" rx="4" fill="#F6F4EF" fill-opacity="0.10" stroke="#F6F4EF" stroke-opacity="0.18"/>

    <text x="300" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="19" font-weight="700" fill="#0E2038">4 miles / $</text>
    <text x="700" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="19" font-weight="700" fill="#F6F4EF" opacity="0.55">0.4 miles / $</text>

    <text x="300" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700" letter-spacing="0.8" fill="#C89A3C">FIRST S$1,000</text>
    <text x="700" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700" letter-spacing="0.8" fill="#F6F4EF" opacity="0.42">THE OTHER S$3,000</text>

    <!-- the average across the whole month -->
    <line x1="200" y1="418" x2="1000" y2="418" stroke="#F6F4EF" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="200" y1="412" x2="200" y2="424" stroke="#F6F4EF" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="1000" y1="412" x2="1000" y2="424" stroke="#F6F4EF" stroke-opacity="0.28" stroke-width="1"/>
    <text x="600" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="15" font-weight="600" fill="#F6F4EF" opacity="0.72">average across the whole month &#8212; <tspan font-weight="700" fill="#C89A3C">1.3 miles per dollar</tspan></text>
  </g>

  <text x="600" y="520" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27"
        fill="#F6F4EF" opacity="0.85">A 4-mile card, earning 1.3.</text>

  <text x="600" y="572" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        letter-spacing="2.6" fill="#C89A3C" opacity="0.72">THEENOUGHPOINT.COM</text>
</svg>
