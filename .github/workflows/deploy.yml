name: Build and deploy Astro site

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # A red gate keeps the previous version of the site live instead of
      # shipping the defect. Offline checks only — external-link probing
      # stays in preflight, where a third party's outage cannot block a
      # deploy. Both scripts are stdlib-only Python.
      - name: Publish gate (SEO audit + link sweep)
        run: |
          python3 scripts/seo-audit.py
          python3 scripts/link-sweep.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=theenoughpoint --branch=main
